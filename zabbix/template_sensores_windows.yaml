zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 68959204beb348279ccd3d51380f43b3
      name: Personalizados
  templates:
    - uuid: 05f45a95180346d580f2fb5b7685a220
      template: 'Template Sensores Windows'
      name: 'Template Sensores Windows'
      description: |
        Sensores de hardware (desktop e notebook) coletados do LibreHardwareMonitor.
        
        Requisitos no host Windows
        - LibreHardwareMonitor em execução elevada com Remote Web Server ativo (porta 8085)
        - UserParameter lhm.sensors no Zabbix Agent 2 retornando um array JSON com os campos hardware, id, name, type, unit e value
        - Interface do agente em modo ativo (ServerActive e Hostname iguais ao host name no frontend)
        
        Coleta
        - Um único item mestre (lhm.sensors) e todos os sensores como itens dependentes, sem nova execução do script
        - A descoberta reduz o JSON a metadados e só reprocessa quando a lista de sensores muda (heartbeat de 1h)
        
        Ajuste fino
        - Tipos, nomes e hardware descobertos são filtrados pelas macros {$LHM.SENSOR.*}
        - Limites de temperatura aceitam contexto por {#SENSOR_ID}, com regex já definidas para CPU, GPU, armazenamento e placa-mãe
        - Triggers de ventoinha ficam inativas com {$LHM.FAN.MIN}=0. Defina contexto por sensor para ativar
        - Triggers de bateria e de vida útil de SSD só são criadas quando o sensor existe (overrides da LLD)
      vendor:
        name: mauro.paiva
        version: 7.0-3
      groups:
        - name: Personalizados
      items:
        - uuid: fc731e2ee82f4133b0067a9de9fd2c07
          name: 'Sensores de Hardware (LHM JSON)'
          type: ZABBIX_ACTIVE
          key: lhm.sensors
          delay: '{$LHM.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Item mestre. Retorna o array JSON completo de sensores do LibreHardwareMonitor. Não armazena histórico, apenas alimenta os itens dependentes e a descoberta.'
          timeout: 10s
          tags:
            - tag: component
              value: hardware
            - tag: component
              value: raw
            - tag: source
              value: librehardwaremonitor
            - tag: target
              value: sensors
        - uuid: b77462cb3e614ccd8febce76a554b5f9
          name: 'LHM: quantidade de sensores retornados'
          type: DEPENDENT
          key: lhm.sensors.count
          delay: '0'
          history: 7d
          description: 'Quantidade de sensores no JSON. Queda brusca costuma indicar LibreHardwareMonitor sem privilégio de administrador ou reiniciado. Ausência de dados indica falha do script ou do Remote Web Server.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.length()
          master_item:
            key: lhm.sensors
          tags:
            - tag: component
              value: hardware
            - tag: component
              value: health
            - tag: source
              value: librehardwaremonitor
          triggers:
            - uuid: c529770e15d64d5e9e9bea70fc5b4372
              expression: 'last(/Template Sensores Windows/lhm.sensors.count)<max(/Template Sensores Windows/lhm.sensors.count,1h)*{$LHM.SENSORS.DROP.RATIO}'
              name: 'LHM: quantidade de sensores caiu de forma abrupta'
              opdata: 'Atual: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: 'A quantidade de sensores ficou abaixo de {$LHM.SENSORS.DROP.RATIO} vezes o máximo da última hora. Causa comum é o LibreHardwareMonitor executando sem elevação, o que remove sensores de CPU e placa-mãe.'
              dependencies:
                - name: 'LHM: sem dados de sensores há {$LHM.NODATA.TIMEOUT}'
                  expression: 'nodata(/Template Sensores Windows/lhm.sensors.count,{$LHM.NODATA.TIMEOUT})=1'
              tags:
                - tag: component
                  value: health
                - tag: scope
                  value: availability
            - uuid: 54ff845b3bbe4551998fcbc1968500dc
              expression: 'nodata(/Template Sensores Windows/lhm.sensors.count,{$LHM.NODATA.TIMEOUT})=1'
              name: 'LHM: sem dados de sensores há {$LHM.NODATA.TIMEOUT}'
              priority: AVERAGE
              description: 'O item mestre lhm.sensors não entrega JSON válido. Verifique se o LibreHardwareMonitor está aberto, se o Remote Web Server responde em http://localhost:8085/data.json e se o agente ativo está conectado.'
              tags:
                - tag: component
                  value: health
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 09194dcff3ae4bf58fd0de4b2de5011b
          name: 'Hardware Sensors Discovery'
          type: DEPENDENT
          key: lhm.sensors.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#SENSOR_HW}'
                value: '{$LHM.SENSOR.HW.MATCHES}'
                formulaid: A
              - macro: '{#SENSOR_HW}'
                value: '{$LHM.SENSOR.HW.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
              - macro: '{#SENSOR_NAME}'
                value: '{$LHM.SENSOR.NAME.MATCHES}'
                formulaid: C
              - macro: '{#SENSOR_NAME}'
                value: '{$LHM.SENSOR.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: D
              - macro: '{#SENSOR_TYPE}'
                value: '{$LHM.SENSOR.TYPE.MATCHES}'
                formulaid: E
              - macro: '{#SENSOR_TYPE}'
                value: '{$LHM.SENSOR.TYPE.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: F
          lifetime: 30d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          description: 'Descobre os sensores do LibreHardwareMonitor a partir do item mestre. O pré-processamento remove os valores e ordena a lista, de modo que a regra só é reprocessada quando sensores entram ou saem.'
          item_prototypes:
            - uuid: c81a399c449e416391b3dd6dda297e01
              name: 'Hardware: {#SENSOR_HW} - {#SENSOR_NAME} ({#SENSOR_TYPE})'
              type: DEPENDENT
              key: 'lhm.sensor[{#SENSOR_ID}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: '!{#SENSOR_UNIT}'
              description: 'Sensor {#SENSOR_ID} do tipo {#SENSOR_TYPE} em {#SENSOR_HW}.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.id == ''{#SENSOR_ID}'')].value.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: lhm.sensors
              tags:
                - tag: component
                  value: hardware
                - tag: component
                  value: '{#SENSOR_TYPE}'
                - tag: sensor.hw
                  value: '{#SENSOR_HW}'
                - tag: sensor.type
                  value: '{#SENSOR_TYPE}'
              trigger_prototypes:
                - uuid: 2c865c4a077b4532a10bf62d9ccb9f90
                  expression: 'last(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}])>{$LHM.STORAGE.WEAR.WARN}'
                  name: 'Armazenamento com desgaste elevado: {#SENSOR_HW} (>{$LHM.STORAGE.WEAR.WARN}%)'
                  opdata: 'Atual: {ITEM.LASTVALUE1}'
                  discover: NO_DISCOVER
                  priority: WARNING
                  description: 'Percentual de vida útil consumido (SMART NVMe Percentage Used) acima do limite.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: storage
                    - tag: scope
                      value: capacity
                - uuid: fbf83beee1c94c6b83ffd81d781a36f9
                  expression: 'last(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}])<{$LHM.STORAGE.LIFE.MIN}'
                  name: 'Armazenamento com vida útil baixa: {#SENSOR_HW} - {#SENSOR_NAME} (<{$LHM.STORAGE.LIFE.MIN}%)'
                  opdata: 'Atual: {ITEM.LASTVALUE1}'
                  discover: NO_DISCOVER
                  priority: HIGH
                  description: 'Vida útil restante ou área reserva do SSD abaixo do limite. Planejar substituição e conferir backup.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: storage
                    - tag: scope
                      value: capacity
                - uuid: 9193df03bbe1426295a11c075859d921
                  expression: 'last(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}])<{$LHM.BATTERY.CHARGE.WARN}'
                  name: 'Bateria com carga baixa: {#SENSOR_HW} (<{$LHM.BATTERY.CHARGE.WARN}%)'
                  opdata: 'Atual: {ITEM.LASTVALUE1}'
                  discover: NO_DISCOVER
                  priority: WARNING
                  dependencies:
                    - name: 'Bateria com carga crítica: {#SENSOR_HW} (<{$LHM.BATTERY.CHARGE.CRIT}%)'
                      expression: 'last(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}])<{$LHM.BATTERY.CHARGE.CRIT}'
                  tags:
                    - tag: component
                      value: battery
                    - tag: scope
                      value: capacity
                - uuid: 457ed48781074e24b97d0c8d3d442ff1
                  expression: 'last(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}])<{$LHM.BATTERY.CHARGE.CRIT}'
                  name: 'Bateria com carga crítica: {#SENSOR_HW} (<{$LHM.BATTERY.CHARGE.CRIT}%)'
                  opdata: 'Atual: {ITEM.LASTVALUE1}'
                  discover: NO_DISCOVER
                  priority: HIGH
                  tags:
                    - tag: component
                      value: battery
                    - tag: scope
                      value: capacity
                - uuid: f01a7f35016f4676ad55ba445eda63b4
                  expression: 'last(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}])>{$LHM.BATTERY.DEGRADATION.WARN}'
                  name: 'Bateria com degradação elevada: {#SENSOR_HW} (>{$LHM.BATTERY.DEGRADATION.WARN}%)'
                  opdata: 'Atual: {ITEM.LASTVALUE1}'
                  discover: NO_DISCOVER
                  priority: WARNING
                  description: 'Perda de capacidade em relação à capacidade de projeto acima do limite. Avaliar substituição da bateria.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: battery
                    - tag: scope
                      value: capacity
                - uuid: eaf0f7e3f6984f73b9600627d3c4c0e2
                  expression: 'min(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}],{$LHM.TEMP.PERIOD})>{$LHM.TEMP.CRIT:"{#SENSOR_ID}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}],{$LHM.TEMP.PERIOD})<{$LHM.TEMP.CRIT:"{#SENSOR_ID}"}-{$LHM.TEMP.HYST}'
                  name: 'Temperatura acima do limite crítico: {#SENSOR_HW} - {#SENSOR_NAME} (>{$LHM.TEMP.CRIT:"{#SENSOR_ID}"}°C)'
                  opdata: 'Atual: {ITEM.LASTVALUE1}'
                  discover: NO_DISCOVER
                  priority: HIGH
                  description: 'Temperatura mínima dos últimos {$LHM.TEMP.PERIOD} acima do limite crítico. Risco de thermal throttling ou desligamento.'
                  tags:
                    - tag: component
                      value: temperature
                    - tag: scope
                      value: performance
                - uuid: cb7fb047e3f04955aad920b991cd734d
                  expression: 'min(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}],{$LHM.TEMP.PERIOD})>{$LHM.TEMP.WARN:"{#SENSOR_ID}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'max(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}],{$LHM.TEMP.PERIOD})<{$LHM.TEMP.WARN:"{#SENSOR_ID}"}-{$LHM.TEMP.HYST}'
                  name: 'Temperatura acima do limite de atenção: {#SENSOR_HW} - {#SENSOR_NAME} (>{$LHM.TEMP.WARN:"{#SENSOR_ID}"}°C)'
                  opdata: 'Atual: {ITEM.LASTVALUE1}'
                  discover: NO_DISCOVER
                  priority: WARNING
                  description: 'Temperatura mínima dos últimos {$LHM.TEMP.PERIOD} acima do limite de atenção. Recupera quando o máximo do período fica {$LHM.TEMP.HYST}°C abaixo do limite.'
                  dependencies:
                    - name: 'Temperatura acima do limite crítico: {#SENSOR_HW} - {#SENSOR_NAME} (>{$LHM.TEMP.CRIT:"{#SENSOR_ID}"}°C)'
                      expression: 'min(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}],{$LHM.TEMP.PERIOD})>{$LHM.TEMP.CRIT:"{#SENSOR_ID}"}'
                      recovery_expression: 'max(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}],{$LHM.TEMP.PERIOD})<{$LHM.TEMP.CRIT:"{#SENSOR_ID}"}-{$LHM.TEMP.HYST}'
                  tags:
                    - tag: component
                      value: temperature
                    - tag: scope
                      value: performance
                - uuid: 3b8d36285f7145de96a6c8cf76928a7b
                  expression: 'max(/Template Sensores Windows/lhm.sensor[{#SENSOR_ID}],{$LHM.FAN.PERIOD})<{$LHM.FAN.MIN:"{#SENSOR_ID}"}'
                  name: 'Ventoinha abaixo do mínimo: {#SENSOR_HW} - {#SENSOR_NAME} (<{$LHM.FAN.MIN:"{#SENSOR_ID}"} RPM)'
                  opdata: 'Atual: {ITEM.LASTVALUE1}'
                  discover: NO_DISCOVER
                  priority: AVERAGE
                  description: 'Rotação máxima dos últimos {$LHM.FAN.PERIOD} abaixo do mínimo. Com a macro LHM.FAN.MIN em 0 a trigger nunca dispara. Ative por sensor criando a macro com contexto igual ao {#SENSOR_ID} da ventoinha.'
                  tags:
                    - tag: component
                      value: fan
                    - tag: scope
                      value: availability
          graph_prototypes:
            - uuid: 7cd451d5328946ccbe68dea02ad4de32
              name: 'Armazenamento: {#SENSOR_HW} - {#SENSOR_NAME}'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 3949AB
                  calc_fnc: ALL
                  item:
                    host: 'Template Sensores Windows'
                    key: 'lhm.sensor[{#SENSOR_ID}]'
              discover: NO_DISCOVER
            - uuid: 2d450d92e61c41349edf810f3f27bbf5
              name: 'Bateria: {#SENSOR_HW} - {#SENSOR_NAME}'
              ymin_type_1: FIXED
              ymax_type_1: FIXED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 00C853
                  calc_fnc: ALL
                  item:
                    host: 'Template Sensores Windows'
                    key: 'lhm.sensor[{#SENSOR_ID}]'
              discover: NO_DISCOVER
            - uuid: e90582cdc99b48928bf63a2b939fdb4a
              name: 'Temperatura: {#SENSOR_HW} - {#SENSOR_NAME}'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: FF5722
                  calc_fnc: ALL
                  item:
                    host: 'Template Sensores Windows'
                    key: 'lhm.sensor[{#SENSOR_ID}]'
              discover: NO_DISCOVER
            - uuid: 34fe2d50ce3348aabab8d6ba87f34849
              name: 'Ventoinha: {#SENSOR_HW} - {#SENSOR_NAME}'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 26A69A
                  calc_fnc: ALL
                  item:
                    host: 'Template Sensores Windows'
                    key: 'lhm.sensor[{#SENSOR_ID}]'
              discover: NO_DISCOVER
          master_item:
            key: lhm.sensors
          lld_macro_paths:
            - lld_macro: '{#SENSOR_HW}'
              path: $.hardware
            - lld_macro: '{#SENSOR_ID}'
              path: $.id
            - lld_macro: '{#SENSOR_NAME}'
              path: $.name
            - lld_macro: '{#SENSOR_TYPE}'
              path: $.type
            - lld_macro: '{#SENSOR_UNIT}'
              path: $.unit
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  if (!Array.isArray(data)) {
                      return value;
                  }
                  var out = [];
                  for (var i = 0; i < data.length; i++) {
                      var s = data[i];
                      out.push({hardware: s.hardware, id: s.id, name: s.name, type: s.type, unit: s.unit});
                  }
                  out.sort(function (a, b) {
                      return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
                  });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          overrides:
            - name: 'Temperatura: criar triggers e gráficos'
              step: '1'
              filter:
                conditions:
                  - macro: '{#SENSOR_TYPE}'
                    value: ^Temperature$
                    formulaid: A
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'Temperatura acima'
                  discover: DISCOVER
                - operationobject: GRAPH_PROTOTYPE
                  operator: LIKE
                  value: 'Temperatura:'
                  discover: DISCOVER
            - name: 'Temperatura: sem triggers e gráficos por núcleo individual'
              step: '2'
              filter:
                evaltype: AND
                conditions:
                  - macro: '{#SENSOR_NAME}'
                    value: '^(CPU )?(P-|E-)?Core #[0-9]+'
                    formulaid: A
                  - macro: '{#SENSOR_TYPE}'
                    value: ^Temperature$
                    formulaid: B
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'Temperatura acima'
                  discover: NO_DISCOVER
                - operationobject: GRAPH_PROTOTYPE
                  operator: LIKE
                  value: 'Temperatura:'
                  discover: NO_DISCOVER
            - name: 'Ventoinha: criar trigger e gráfico'
              step: '3'
              filter:
                conditions:
                  - macro: '{#SENSOR_TYPE}'
                    value: ^Fan$
                    formulaid: A
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'Ventoinha abaixo'
                  discover: DISCOVER
                - operationobject: GRAPH_PROTOTYPE
                  operator: LIKE
                  value: 'Ventoinha:'
                  discover: DISCOVER
            - name: 'Bateria: nível de carga'
              step: '4'
              filter:
                evaltype: AND
                conditions:
                  - macro: '{#SENSOR_NAME}'
                    value: '^Charge Level$'
                    formulaid: A
                  - macro: '{#SENSOR_TYPE}'
                    value: ^Level$
                    formulaid: B
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'Bateria com carga'
                  discover: DISCOVER
                - operationobject: GRAPH_PROTOTYPE
                  operator: LIKE
                  value: 'Bateria:'
                  discover: DISCOVER
            - name: 'Bateria: degradação'
              step: '5'
              filter:
                evaltype: AND
                conditions:
                  - macro: '{#SENSOR_NAME}'
                    value: '^Degradation Level$'
                    formulaid: A
                  - macro: '{#SENSOR_TYPE}'
                    value: ^Level$
                    formulaid: B
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'Bateria com degradação'
                  discover: DISCOVER
                - operationobject: GRAPH_PROTOTYPE
                  operator: LIKE
                  value: 'Bateria:'
                  discover: DISCOVER
            - name: 'Armazenamento: desgaste'
              step: '6'
              filter:
                evaltype: AND
                conditions:
                  - macro: '{#SENSOR_NAME}'
                    value: '^Percentage Used$'
                    formulaid: A
                  - macro: '{#SENSOR_TYPE}'
                    value: ^Level$
                    formulaid: B
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'Armazenamento com desgaste'
                  discover: DISCOVER
                - operationobject: GRAPH_PROTOTYPE
                  operator: LIKE
                  value: 'Armazenamento:'
                  discover: DISCOVER
            - name: 'Armazenamento: vida útil e área reserva'
              step: '7'
              filter:
                evaltype: AND
                conditions:
                  - macro: '{#SENSOR_NAME}'
                    value: '^(Remaining Life|Available Spare)$'
                    formulaid: A
                  - macro: '{#SENSOR_TYPE}'
                    value: ^Level$
                    formulaid: B
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'Armazenamento com vida útil'
                  discover: DISCOVER
                - operationobject: GRAPH_PROTOTYPE
                  operator: LIKE
                  value: 'Armazenamento:'
                  discover: DISCOVER
            - name: 'Histórico curto para sensores de alta variação'
              step: '8'
              filter:
                conditions:
                  - macro: '{#SENSOR_TYPE}'
                    value: ^(Clock|Load|Control|Data|SmallData|Throughput)$
                    formulaid: A
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: 'Hardware:'
                  history: 7d
                  trends: 180d
      tags:
        - tag: class
          value: hardware
        - tag: target
          value: librehardwaremonitor
      macros:
        - macro: '{$LHM.BATTERY.CHARGE.CRIT}'
          value: '10'
          description: 'Carga da bateria (%) abaixo da qual gera alerta crítico.'
        - macro: '{$LHM.BATTERY.CHARGE.WARN}'
          value: '20'
          description: 'Carga da bateria (%) abaixo da qual gera alerta de atenção.'
        - macro: '{$LHM.BATTERY.DEGRADATION.WARN}'
          value: '30'
          description: 'Degradação da bateria (%) acima da qual gera alerta.'
        - macro: '{$LHM.FAN.MIN}'
          value: '0'
          description: 'Rotação mínima (RPM). Valor 0 desativa a trigger. Use contexto por {#SENSOR_ID} para ativar em ventoinhas específicas.'
        - macro: '{$LHM.FAN.PERIOD}'
          value: 5m
          description: 'Janela de avaliação das triggers de ventoinha.'
        - macro: '{$LHM.INTERVAL}'
          value: 1m
          description: 'Intervalo de coleta do item mestre lhm.sensors.'
        - macro: '{$LHM.NODATA.TIMEOUT}'
          value: 10m
          description: 'Tempo sem dados até gerar alerta de falha de coleta.'
        - macro: '{$LHM.SENSOR.HW.MATCHES}'
          value: '.*'
          description: 'Regex de hardware ({#SENSOR_HW}) a descobrir.'
        - macro: '{$LHM.SENSOR.HW.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex de hardware ({#SENSOR_HW}) a ignorar.'
        - macro: '{$LHM.SENSOR.NAME.MATCHES}'
          value: '.*'
          description: 'Regex de nome de sensor ({#SENSOR_NAME}) a descobrir.'
        - macro: '{$LHM.SENSOR.NAME.NOT_MATCHES}'
          value: 'Distance to TjMax'
          description: 'Regex de nome de sensor ({#SENSOR_NAME}) a ignorar. Por padrão descarta os sensores Distance to TjMax.'
        - macro: '{$LHM.SENSOR.TYPE.MATCHES}'
          value: ^(Temperature|Fan|Control|Load|Clock|Voltage|Current|Power|Energy|Level|Data|SmallData|Throughput)$
          description: 'Regex de tipos de sensor ({#SENSOR_TYPE}) a descobrir. Level, Current e Energy cobrem bateria e vida útil de SSD.'
        - macro: '{$LHM.SENSOR.TYPE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Regex de tipos de sensor ({#SENSOR_TYPE}) a ignorar.'
        - macro: '{$LHM.SENSORS.DROP.RATIO}'
          value: '0.8'
          description: 'Fração do máximo da última hora abaixo da qual a queda na quantidade de sensores gera alerta.'
        - macro: '{$LHM.STORAGE.LIFE.MIN}'
          value: '20'
          description: 'Vida útil restante ou área reserva (%) mínima do SSD.'
        - macro: '{$LHM.STORAGE.WEAR.WARN}'
          value: '80'
          description: 'Desgaste (%) do SSD NVMe acima do qual gera alerta.'
        - macro: '{$LHM.TEMP.CRIT}'
          value: '90'
          description: 'Limite crítico padrão de temperatura (°C).'
        - macro: '{$LHM.TEMP.CRIT:regex:"^/(amdcpu|intelcpu)/"}'
          value: '95'
          description: 'Limite crítico de temperatura da CPU (°C).'
        - macro: '{$LHM.TEMP.CRIT:regex:"^/(gpu-amd|gpu-intel|gpu-nvidia)/"}'
          value: '90'
          description: 'Limite crítico de temperatura da GPU (°C).'
        - macro: '{$LHM.TEMP.CRIT:regex:"^/(hdd|nvme|ssd)/"}'
